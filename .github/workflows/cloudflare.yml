name: Cloudflare website

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check setup, deploy, or deploy and activate product and plan payments
        type: choice
        options: [check, deploy, activate]
        default: check
        required: true

permissions:
  contents: read

concurrency:
  group: framy-cloudflare-production
  cancel-in-progress: false

jobs:
  website:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:cloudflare
      - name: Verify Cloudflare target and secret names
        run: node scripts/check-cloudflare-access.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Inspect pending database migrations
        run: node scripts/repair-cloudflare-db.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record recovery point and apply compatible migrations
        if: inputs.operation == 'deploy' || inputs.operation == 'activate'
        run: node scripts/repair-cloudflare-db.mjs --apply --time-travel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the checked build
        if: inputs.operation == 'deploy' || inputs.operation == 'activate'
        run: node node_modules/wrangler/bin/wrangler.js deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Activate product checkout and profile billing
        if: inputs.operation == 'activate'
        run: node scripts/activate-paysuite.mjs --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
